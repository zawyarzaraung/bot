name: IPTV Auto-Healing System

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # ၆ နာရီတစ်ကြိမ် အော်တိုပတ်မည့်စနစ်

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run IPTV Checker
        run: python iptv_checker.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add active.m3u dead.m3u
          git diff --cached --quiet || git commit -m "Automated Playlist Update"
          git push
